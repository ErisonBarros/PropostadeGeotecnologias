apresentacao:
  - "A R. Oliveira Consultoria, atuante em engenharia cartográfica, agrimensura e regularização imobiliária, apresenta a presente proposta técnico-comercial para execução dos serviços de georreferenciamento do imóvel rural denominado Sítio Boa Esperança, situado no município de Paudalho/PE."
  - "A proposta foi elaborada a partir dos dados disponibilizados pelo contratante e observa as normas técnicas do INCRA para certificação de imóveis rurais no Sistema de Gestão Fundiária (SIGEF), bem como as normas da ABNT aplicáveis a levantamentos topográficos."

objeto:
  resumo: "Execução de levantamento topográfico georreferenciado dos limites do imóvel rural Sítio Boa Esperança, com área aproximada de 45,2 ha, para fins de certificação no SIGEF/INCRA e posterior averbação/retificação na matrícula imobiliária."
  finalidade: "Obtenção do certificado de georreferenciamento junto ao INCRA e regularização da área junto ao Registro de Imóveis competente."

escopo:
  etapas:
    - titulo: "Planejamento e aquisição de dados"
      descricao: "Análise da documentação disponível (matrícula, CCIR, ITR e plantas), verificação de sobreposição com imóveis certificados na base do SIGEF, definição da estratégia de levantamento e do plano de vértices."
    - titulo: "Implantação e rastreio GNSS"
      descricao: "Rastreio de base no vértice de referência do SBAS/SIRGAS2000, com receptor GNSS de dupla frequência, e transporte de coordenadas aos vértices de apoio, garantindo precisão compatível com a Norma Técnica para Georreferenciamento de Imóveis Rurais."
    - titulo: "Levantamento dos limites e confrontações"
      descricao: "Determinação das coordenadas dos vértices definidores dos limites, na presença dos confrontantes quando possível, com registro fotográfico, croqui e coleta de dados qualitativos (natureza do limite, tipo de vértice e nome dos confrontantes)."
    - titulo: "Processamento e ajustamento"
      descricao: "Processamento dos dados GNSS em linhas de base, ajustamento pelo método dos mínimos quadrados, cálculo de áreas e perímetros, geração do memorial descritivo e da planilha analítica de vértices."
    - titulo: "Submissão e acompanhamento no SIGEF"
      descricao: "Envio do arquivo de vértices e do memorial descritivo à Plataforma de Gestão Fundiária (SIGEF), acompanhamento da análise e atendimento às notificações técnicas até a certificação."
  entregaveis:
    - "Memorial descritivo georreferenciado com quadro analítico de vértices, em conformidade com a norma do INCRA."
    - "Planilha de coordenadas (formato ODS/SHP) e arquivo de vértices nos formatos exigidos pelo SIGEF."
    - "Planta do imóvel com indicação de vértices, confrontantes e área, em formato PDF e DWG."
    - "Certificado de georreferenciamento emitido pelo INCRA/SIGEF e comprovantes de submissão."
    - "Anotação de Responsabilidade Técnica (ART) emitida e recolhida junto ao CREA-PE."
  nao_inclusos:
    - "Taxas, emolumentos e custas de terceiros (INCRA, cartório, prefeitura), de responsabilidade do contratante."
    - "Levantamento de dados jurídicos, pesquisas de cadeia dominial e serviços advocatícios."
    - "Demarcação física, construção de cercas, marcos ou placas de identificação dos vértices."
    - "Deslocamentos extraordinários decorrentes de alteração de local ou de novas convocações de confrontantes."

metodologia:
  paragrafos:
    - "Os serviços serão executados com receptores GNSS de dupla frequência operando nos sistemas GPS e GLONASS, pelo método relativo estático e estático-rápido, tendo como referência o Sistema Geodésico Brasileiro (SIRGAS2000). O rastreio será apoiado em vértices com coordenadas conhecidas e precisão compatível com a classe exigida para o georreferenciamento de imóveis rurais."
    - "O processamento e o ajustamento dos dados serão realizados em software topográfico com controle de qualidade estatístico (resíduos, desvio-padrão e elipses de erro), assegurando que as discrepâncias posicionais atendam aos limites estabelecidos pela norma vigente do INCRA."
    - "A documentação técnica será produzida em conformidade com as exigências da Plataforma de Gestão Fundiária, incluindo o memorial descritivo, a planilha analítica e o arquivo de vértices, de modo a permitir a submissão direta ao SIGEF."
  normas:
    - "INCRA — Norma Técnica para Georreferenciamento de Imóveis Rurais (NTGIR), edição vigente."
    - "INCRA — Manual Técnico de Limites e Confrontações e Manual do SIGEF."
    - "ABNT NBR 13133 — Execução de levantamento topográfico."
    - "ABNT NBR 14166 — Rede de Referência Cadastral Municipal."
    - "Decreto-Lei nº 9.760/1946 e Lei nº 10.267/2001 (georreferenciamento de imóveis rurais)."

cronograma:
  prazo_dias: 60
  etapas:
    - fase: "1"
      descricao: "Mobilização, análise documental e planejamento"
      prazo: "7 dias"
    - fase: "2"
      descricao: "Levantamento de campo e rastreio GNSS"
      prazo: "15 dias"
    - fase: "3"
      descricao: "Processamento, ajustamento e elaboração das peças técnicas"
      prazo: "13 dias"
    - fase: "4"
      descricao: "Submissão ao SIGEF e acompanhamento até a certificação"
      prazo: "25 dias"
  observacao: "Os prazos das fases 3 e 4 podem ser afetados pelo tempo de resposta do INCRA e pela disponibilidade dos confrontantes."

