premissas:
  - "O contratante deverá disponibilizar matrícula atualizada, CCIR, ITR e documentos pessoais antes do início dos trabalhos."
  - "A presença dos confrontantes ou de seus procuradores nas frentes de serviço é de responsabilidade do contratante."
  - "Acesso ao imóvel e autorização para entrada de equipe e equipamentos são de responsabilidade do contratante."
  - "Não estão inclusos serviços de retificação administrativa em cartório, desmembramento, parcelamento ou loteamento."
  - "A certificação pelo INCRA depende da análise do órgão e da inexistência de sobreposição com imóveis de terceiros, não sendo possível garantir prazo ou resultado."

disposicoes:
