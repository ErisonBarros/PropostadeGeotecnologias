<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proposta - R Oliveira Consultoria</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            padding: 40px;
        }
        .card {
            background-color: white;
            width: 100%;
            max-width: 600px;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-top: 10px solid #333;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo-box {
            background-color: #d1d1d1;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 50px;
            font-weight: serif;
            color: white;
        }
        .company-name {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #333;
            margin: 0;
        }
        .subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
        }
        .divider {
            height: 1px;
            background-color: #eee;
            margin: 20px 0;
        }
        .info-section {
            line-height: 1.6;
            color: #444;
        }
        .info-item {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }
        .info-item strong {
            width: 100px;
            color: #000;
        }
        .address {
            margin-top: 20px;
            font-size: 0.9em;
            color: #777;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <div class="logo-box">R</div>
        <h1 class="company-name">R OLIVEIRA</h1>
        <div class="subtitle">AGATE HORSE | CONSULTORIA</div>
    </div>

    <div class="divider"></div>

    <div class="info-section">
        <div class="info-item">
            <strong>WhatsApp:</strong> (81) 98157-1227
        </div>
        <div class="info-item">
            <strong>Instagram:</strong> @r.oliveiraconsultoria
        </div>
        <div class="info-item">
            <strong>E-mail:</strong> rodrigocabral@uol.com.br
        </div>
    </div>

    <div class="divider"></div>

    <div class="address">
        <p>Praça Pedro Coutinho, 56 - Anexo Aderita Rosa de Oliveira<br>
        Loja 02 Centro - Paudalho/PE - CEP 55.825-000</p>
    </div>
</div>

</body>
</html>
